[workspace]
resolver = "3"
members = ["apps/xtractor", "apps/nserter", "apps/backend", "apps/pubtator3"]

[workspace.dependencies]
# Keep both drivers compatible with the same native SQLite bindings.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "derive", "migrate", "macros"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
