services:
  neo4j:
    image: neo4j:5.26-community
    container_name: herdlink-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  neo4j-data:
    name: herdlink-neo4j-data
