[package]
name = "pubtator3-hpo"
version = "0.1.0"
edition = "2024"
description = "Disease mapping and phenotype similarity using PubTator3, Mondo, and HPO"
readme = "README.md"

[dependencies]
pubtator3 = { path = "../pubtator3" }
hpo = "0.12"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
